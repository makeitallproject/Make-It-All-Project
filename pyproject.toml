[project]
name = "make-it-all-project"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyqt6>=6.11.0"]

[project.scripts]
make-it-all = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/widgets", "src/screens"]
force-include = { "src/main.py" = "main.py" }
